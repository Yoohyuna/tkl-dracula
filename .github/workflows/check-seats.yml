name: Ticketlink Dracula Seat Check

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 10
    steps:
      - name: Stop once the show date has passed
        id: gate
        run: |
          today=$(TZ=Asia/Seoul date +%Y-%m-%d)
          echo "today (KST): $today"
          if [[ "$today" > "2026-10-10" ]]; then
            echo "expired=true" >> "$GITHUB_OUTPUT"
          else
            echo "expired=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Disable this workflow (past show date)
        if: steps.gate.outputs.expired == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/check-seats.yml/disable"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.expired != 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.expired != 'true'
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.expired != 'true'
        run: npm ci

      - name: Check seats
        if: steps.gate.outputs.expired != 'true'
        run: node scripts/check_seats.js
